<div class="rich-picker mat-elevation-z4"
    style="position: absolute; bottom: 80px; left: 20px; width: 320px; height: 400px; background: white; border-radius: 8px; display: flex; flex-direction: column; z-index: 100; border: 1px solid #ddd; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">

    <!-- Tabs -->
    <div style="display: flex; background: #f5f5f5; border-bottom: 1px solid #ddd; flex-shrink: 0;">
        <div (click)="pickerTab = 'emoji'" [style.background]="pickerTab === 'emoji' ? 'white' : 'transparent'"
            [style.border-bottom]="pickerTab === 'emoji' ? '2px solid #00acc1' : 'none'"
            style="flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; color: #555;">Emojis
        </div>
        <div (click)="pickerTab = 'gif'" [style.background]="pickerTab === 'gif' ? 'white' : 'transparent'"
            [style.border-bottom]="pickerTab === 'gif' ? '2px solid #00acc1' : 'none'"
            style="flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; color: #555;">GIFs
        </div>
    </div>

    <!-- Emoji Tab Body -->
    <div *ngIf="pickerTab === 'emoji'" style="flex: 1; overflow-y: auto; padding: 10px;">
        <div *ngFor="let cat of emojiCategories">
            <div
                style="font-size: 12px; color: #888; font-weight: bold; margin: 10px 0 5px 5px; text-transform: uppercase;">
                {{cat.name}}</div>
            <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px;">
                <span *ngFor="let emoji of cat.emojis" (click)="selectEmoji(emoji)"
                    style="cursor: pointer; font-size: 24px; text-align: center; padding: 5px; border-radius: 4px; transition: background 0.2s; user-select: none;"
                    onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='transparent'">
                    {{emoji}}
                </span>
            </div>
        </div>
    </div>

    <!-- GIF Tab Body -->
    <div *ngIf="pickerTab === 'gif'"
        style="flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column;">
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
            <img *ngFor="let gif of trendingGifs" [src]="gif" (click)="selectGif(gif)"
                style="width: 100%; height: 100px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.2s;"
                onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'" alt="gif">
        </div>
        <button mat-stroked-button color="primary" style="margin-top: 15px; width: 100%; flex-shrink: 0;"
            (click)="sendCustomGif()">Enter Custom GIF URL</button>
    </div>

</div>
